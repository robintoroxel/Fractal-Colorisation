<title>Colouring artanh(z⁸)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: five equal square panels in a row (3, 2, then 1 column on smaller screens). */
:root {
  --bg: #f3f4f7; --fg: #171a22; --muted: #5d6475; --line: #d9dce5;
  --std: #5d6475; --std-bg: #e4e6ed; --own: #2f43c9; --own-bg: #dfe3fb;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117; --fg: #e7e9f0; --muted: #959cb0; --line: #2a2f3d;
    --std: #b3b9c9; --std-bg: #232733; --own: #aab5ff; --own-bg: #232a52; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117; --fg: #e7e9f0; --muted: #959cb0; --line: #2a2f3d;
  --std: #b3b9c9; --std-bg: #232733; --own: #aab5ff; --own-bg: #232a52; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.grid { max-width: 1840px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 1280px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 820px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { display: grid; gap: 8px; align-content: start; min-width: 0; }
.panel canvas { width: 100%; max-width: 100%; aspect-ratio: 1; display: block; border-radius: 4px; border: 1px solid var(--line); }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0; }
.badge { font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; padding: 2px 7px; border-radius: 999px; }
.badge.std { color: var(--std); background: var(--std-bg); }
.badge.own { color: var(--own); background: var(--own-bg); }
.panel p { margin: 0; font-size: 13.5px; color: var(--muted); }
</style>

<div class="grid" id="grid"></div>

<script>
(() => {
  const N = 560, R = 1.5;

  // Viridis (polynomial fit of matplotlib's colormap), shared by every panel
  const C = [
    [0.2777273272234177, 0.005407344544966578, 0.3340998053353061],
    [0.1050930431085774, 1.404613529898575, 1.384590162594685],
    [-0.3308618287255563, 0.214847559468213, 0.09509516302823659],
    [-4.634230498983486, -5.799100973351585, -19.33244095627987],
    [6.228269936347081, 14.17993336680509, 56.69055260068105],
    [4.776384997670288, -13.74514537774601, -65.35303263337234],
    [-5.435455855934631, 4.645852612178535, 26.3124352495832]];
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    for (let k = 0; k < 3; k++)
      lut[i*3+k] = 255 * (C[0][k] + t*(C[1][k] + t*(C[2][k] + t*(C[3][k] + t*(C[4][k] + t*(C[5][k] + t*C[6][k]))))));
  }

  // f(z) = artanh(z^8) = ½[log(1 + z^8) − log(1 − z^8)] on [−1.5, 1.5]²
  const re = new Float64Array(N * N), im = new Float64Array(N * N), ab = new Float64Array(N * N);
  for (let j = 0; j < N; j++) {
    const y = R - (2 * R * (j + 0.5)) / N;
    for (let i = 0; i < N; i++) {
      const x = -R + (2 * R * (i + 0.5)) / N, k = j * N + i;
      const r8 = Math.hypot(x, y) ** 8, a = 8 * Math.atan2(y, x);
      const wr = r8 * Math.cos(a), wi = r8 * Math.sin(a);
      re[k] = 0.25 * (Math.log((1 + wr) ** 2 + wi * wi) - Math.log((1 - wr) ** 2 + wi * wi));
      im[k] = 0.5 * (Math.atan2(wi, 1 + wr) - Math.atan2(-wi, 1 - wr));
      ab[k] = Math.hypot(re[k], im[k]);
    }
  }

  const minmax = v => {
    let lo = Infinity, hi = -Infinity;
    for (const x of v) if (Number.isFinite(x)) { if (x < lo) lo = x; if (x > hi) hi = x; }
    const s = hi - lo || 1;
    return Float32Array.from(v, x => (x - lo) / s);
  };
  const deciles = v => {
    const s = Float64Array.from(v.filter(Number.isFinite)).sort(), m = s.length;
    return Array.from({ length: 11 }, (_, k) => { const x = k / 10 * (m - 1), a = Math.floor(x), b = Math.min(m - 1, a + 1); return s[a] + (x - a) * (s[b] - s[a]); });
  };
  // position of x within the deciles q, in [0, 10], linear inside each segment
  const decPos = (q, x) => {
    let k = 0; while (k < 9 && x > q[k + 1]) k++;
    const w = q[k + 1] - q[k];
    return k + (w > 0 ? Math.min(1, Math.max(0, (x - q[k]) / w)) : 0.5);
  };

  const TECHNIQUES = [
    { name: "Min–max scaling", own: false,
      desc: "Linear stretch of |f| from its minimum to its maximum onto the palette.",
      map: () => minmax(ab) },
    { name: "Log scaling", own: false,
      desc: "Min–max scaling of log(1 + |f|).",
      map: () => minmax(ab.map(Math.log1p)) },
    { name: "Histogram equalization", own: false,
      desc: "Each pixel is coloured by the rank of |f| among all pixels.",
      map: () => {
        const n = ab.length, ord = Uint32Array.from({ length: n }, (_, i) => i).sort((a, b) => ab[a] - ab[b]), t = new Float32Array(n);
        for (let s = 0; s < n; ) { let e = s; while (e + 1 < n && ab[ord[e + 1]] === ab[ord[s]]) e++;
          for (let k = s; k <= e; k++) t[ord[k]] = (s + e) / 2 / (n - 1); s = e + 1; }
        return t;
      } },
    { name: "Piecewise-linear deciles", own: true,
      desc: "Linear interpolation of |f| between its 10 quantiles, each segment getting a tenth of the palette.",
      map: () => { const q = deciles(ab); return Float32Array.from(ab, x => decPos(q, x) / 10); } },
    { name: "2-D decile mesh", own: true,
      desc: "Linear interpolation over a triangulated mesh of the Re and Im quantiles, ordered from (0, 0) to (1, 1) along the palette.",
      map: () => { const A = deciles(re), B = deciles(im);
        return Float32Array.from(re, (x, k) => (11 * decPos(A, x) + decPos(B, im[k])) / 120); } },
  ];

  const grid = document.getElementById("grid");
  for (const tq of TECHNIQUES) {
    const el = document.createElement("section");
    el.className = "panel";
    el.innerHTML = `<canvas width="${N}" height="${N}"></canvas>
      <div class="head"><h2>${tq.name}</h2><span class="badge ${tq.own ? "own" : "std"}">${tq.own ? "Own method" : "Standard"}</span></div>
      <p>${tq.desc}</p>`;
    grid.appendChild(el);
    const t = tq.map(), ctx = el.querySelector("canvas").getContext("2d"), img = ctx.createImageData(N, N), d = img.data;
    for (let k = 0; k < t.length; k++) {
      const o = k * 4;
      if (!Number.isFinite(t[k])) { d[o] = d[o+1] = d[o+2] = 128; d[o+3] = 255; continue; }
      const li = Math.max(0, Math.min(255, Math.round(t[k] * 255))) * 3;
      d[o] = lut[li]; d[o+1] = lut[li+1]; d[o+2] = lut[li+2]; d[o+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
})();
</script>
